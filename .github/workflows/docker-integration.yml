name: Docker Compose Integration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-smoke:
    name: Docker full-stack smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare isolated CI environment
        shell: bash
        run: |
          set -euo pipefail
          CI_DB_PASSWORD="$(openssl rand -hex 24)"
          {
            echo 'POSTGRES_DB=neighbourlend_ci'
            echo 'POSTGRES_USER=neighbourlend_ci'
            printf 'POSTGRES_PASSWORD=%s\n' "$CI_DB_PASSWORD"
          } > .env
          chmod 600 .env
          cp neighbourlend/.env.example neighbourlend/.env

          APP_KEY="base64:$(openssl rand -base64 32)"
          sed -i "s|^APP_KEY=.*|APP_KEY=$APP_KEY|" neighbourlend/.env

      - name: Build and start isolated Docker stack
        run: docker compose up -d --build

      - name: Wait for backend Composer dependencies
        shell: bash
        run: |
          set -euo pipefail
          timeout 360 docker compose exec -T backend sh -lc 'until test -f vendor/autoload.php; do sleep 2; done'

      - name: Configure Laravel and apply migrations
        shell: bash
        run: |
          set -euo pipefail
          docker compose exec -T backend php artisan migrate --force
          docker compose exec -T backend php artisan storage:link

      - name: Seed disposable CI catalog
        shell: bash
        run: |
          set -euo pipefail
          docker compose exec -T backend php artisan db:seed --class=UserSeeder --force
          docker compose exec -T backend php artisan db:seed --class=CategorySeeder --force
          docker compose exec -T backend php artisan db:seed --class=ToolSeeder --force

      - name: Check database health and API/frontend endpoints
        shell: bash
        run: |
          set -euo pipefail

          docker compose exec -T db sh -c \
            'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'

          check_url() {
            local url="$1"
            local status

            for attempt in {1..15}; do
              status="$(curl --silent --show-error \
                --max-time 8 \
                --output /tmp/ci-response \
                --write-out '%{http_code}' \
                "$url" || true)"

              if [[ "$status" == "200" ]]; then
                echo "PASS: $url"
                return 0
              fi

              if [[ "$status" == "000" ]]; then
                echo "Waiting for $url (attempt $attempt)"
                sleep 2
                continue
              fi

              echo "::error::HTTP $status from $url"
              return 1
            done

            echo "::error::Timeout waiting for $url"
            return 1
          }

          check_url http://127.0.0.1:8000/up
          check_url http://127.0.0.1:8000/api/categories
          check_url http://127.0.0.1:8000/api/tools
          check_url http://127.0.0.1:3000/

          curl --fail --silent --show-error \
            http://127.0.0.1:8000/api/tools |
            python3 -c 'import json,sys; assert len(json.load(sys.stdin).get("data", [])) > 0, "CI catalog is empty"'

      - name: Create isolated test database
        shell: bash
        run: |
          set -euo pipefail
          docker compose exec -T db sh -c 'createdb -U "$POSTGRES_USER" neighbourlend_test'

      - name: Run full Laravel tests against isolated PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          docker compose exec -T \
            -e APP_ENV=testing \
            -e DB_CONNECTION=pgsql \
            -e DB_DATABASE=neighbourlend_test \
            backend php artisan test

      - name: Show container status and logs on failure
        if: failure()
        shell: bash
        run: |
          docker compose ps || true

          docker compose logs --no-color --tail=120 \
            db backend frontend || true

          docker compose exec -T backend sh -lc \
            'tail -n 100 storage/logs/laravel.log' || true

      - name: Remove isolated CI containers and volumes
        if: always()
        run: docker compose down -v --remove-orphans || true
